<style>
  :root {
    --ground: #F3ECDE; --card: #FBF6EB; --ink: #2C2231; --muted: #6E6172;
    --accent: #B14F1D; --accent-ink: #FFF6EA; --line: #DCD1BE;
    --display: "Young Serif", "Iowan Old Style", Georgia, serif;
    --body: "Karla", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #191521; --card: #231D2E; --ink: #EFE7D8; --muted: #A79DB0;
      --accent: #E28A38; --accent-ink: #2A1707; --line: #383046;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #191521; --card: #231D2E; --ink: #EFE7D8; --muted: #A79DB0;
    --accent: #E28A38; --accent-ink: #2A1707; --line: #383046;
    color-scheme: dark;
  }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--body);
    line-height: 1.55; padding-inline: 20px;
  }
  .landing {
    max-width: 480px; margin: 0 auto; min-height: 96vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 18px; padding-block: 48px;
  }
  .me {
    width: 132px; height: 132px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--line); box-shadow: 0 2px 12px rgba(30,20,40,.15);
  }
  h1 { font-family: var(--display); font-weight: 400; font-size: 2.1rem; margin: 0; }
  .tag { margin: 0; font-size: 1.08rem; color: var(--muted); max-width: 36ch; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 6px; }
  .btn {
    display: inline-block; background: var(--accent); color: var(--accent-ink);
    font-weight: 700; text-decoration: none; padding: 12px 26px; border-radius: 999px; font-size: 1rem;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .btn-ghost:hover { color: var(--accent); border-color: var(--accent); filter: none; }
  .tiny { font-size: .9rem; color: var(--muted); }
  .tiny a { color: inherit; }
  .logo { width: min(100%, 480px); border-radius: 10px; border: 1px solid var(--line); box-shadow: 0 2px 14px rgba(30,20,40,.15); }
  footer { font-size: .8rem; color: var(--muted); margin-top: 10px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
</style>
